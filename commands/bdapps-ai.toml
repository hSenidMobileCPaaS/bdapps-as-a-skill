description = "Build or debug a bdappsAI (bdapps AI gateway) integration"
prompt = "Work on this bdappsAI task: {{args}}. Run `node tools/bdapps.mjs bdappsai` for the contract and `node tools/bdapps.mjs show bdappsai-chat-completions` or `bdappsai-image-generation` for the exact parameters; read references/14-bdapps-ai.md. bdappsAI is NOT the telco platform: the key goes in an Authorization header verbatim with no Bearer prefix, failures are real HTTP status codes with an error object rather than an S1000 envelope, and it needs its own client separate from the telco one. Cap every call with max_completion_tokens, never let an MSISDN or subscriberId reach a prompt, check finish_reason before using the content, and never call a model inside a callback response path."
