description = "Work on a bdapps integration (SMS, USSD, Subscription, OTP, Charging SDK, CaaS)"
prompt = "Use the bdapps skill for this task. bdapps is Robi Axiata's Bangladeshi telco platform. Before writing code, query the contract rather than recalling it: run `node tools/bdapps.mjs list` and `node tools/bdapps.mjs show <id>` for each service involved. Non-negotiable: credentials come from environment variables and are never in source, a client bundle, or a log; bdapps is called from the backend only; branch on statusCode because HTTP 200 does not mean success; charging is idempotent on externalTrxId. Write the integration in whatever language this project already uses — templates/ covers TypeScript/Node, Python, Java, Go, PHP and C#, and references/11-any-stack.md specifies the same integration for any other stack. Task: {{args}}"
